name: Deploy to Elastic Beanstalk

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  id-token: write
  contents: read

concurrency:
  group: eb-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Derive version from commit SHA
        run: echo "VERSION=${GITHUB_SHA::7}" >> "$GITHUB_ENV"

      - name: Stamp version file
        run: echo "$VERSION" > version.txt

      - name: Package source bundle
        run: zip -r "app-$VERSION.zip" application.py requirements.txt Procfile version.txt

      - name: Configure AWS credentials (OIDC, no static keys)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Upload source bundle to S3
        run: aws s3 cp "app-$VERSION.zip" "s3://${{ vars.EB_S3_BUCKET }}/app-$VERSION.zip"

      - name: Create Elastic Beanstalk application version
        run: |
          EXISTING=$(aws elasticbeanstalk describe-application-versions \
            --application-name "${{ vars.EB_APPLICATION_NAME }}" \
            --version-labels "$VERSION" \
            --query "ApplicationVersions[0].VersionLabel" --output text)
          if [ "$EXISTING" = "$VERSION" ]; then
            echo "Version $VERSION already exists (re-run of the same commit) - reusing it."
          else
            aws elasticbeanstalk create-application-version \
              --application-name "${{ vars.EB_APPLICATION_NAME }}" \
              --version-label "$VERSION" \
              --source-bundle S3Bucket="${{ vars.EB_S3_BUCKET }}",S3Key="app-$VERSION.zip" \
              --description "Deployed from $GITHUB_SHA"
          fi

      # UpdateEnvironment fails under any assumed-role session (OIDC included) - see README. Instead of a
      # standing static credential, mint a fresh access key for the narrowly-scoped update-only user, use it
      # once, then delete it. No long-lived secret exists in GitHub at any point.
      - name: Clean up any stale ephemeral access keys
        run: |
          USER="${{ vars.EB_UPDATE_ONLY_USER_NAME }}"
          EXISTING=$(aws iam list-access-keys --user-name "$USER" --query "AccessKeyMetadata[].AccessKeyId" --output text)
          for KEY_ID in $EXISTING; do
            echo "Deleting stale access key $KEY_ID left over from a previous run"
            aws iam delete-access-key --user-name "$USER" --access-key-id "$KEY_ID"
          done

      - name: Create ephemeral access key for the update-only user
        run: |
          USER="${{ vars.EB_UPDATE_ONLY_USER_NAME }}"
          read -r KEY_ID KEY_SECRET <<< "$(aws iam create-access-key --user-name "$USER" --query "AccessKey.[AccessKeyId,SecretAccessKey]" --output text)"
          echo "::add-mask::$KEY_ID"
          echo "::add-mask::$KEY_SECRET"
          echo "UPDATE_KEY_ID=$KEY_ID" >> "$GITHUB_ENV"
          echo "UPDATE_KEY_SECRET=$KEY_SECRET" >> "$GITHUB_ENV"

      # A brand-new access key is usable for direct EB/CFN API calls (update-environment,
      # describe-*) within ~15s, but EB's internal, asynchronous CloudFormation UpdateStack -
      # fired seconds after update-environment returns - reads its template from S3 under this
      # same key, and that path propagates slower. Both real failures we saw ("S3 error: Access
      # Denied" from CloudFormation) hit at ~20s post-creation; this wait puts the whole update
      # past that window before it starts.
      - name: Wait for the ephemeral key to propagate
        run: sleep 30

      # The key must stay alive for the WHOLE update, not just this call - update-environment returns as
      # soon as EB accepts the request, but the actual S3/CloudFormation orchestration behind it (the
      # presigned-URL hand-off from the README) runs asynchronously afterward, still under this identity.
      # Deleting the key right after this step (as we used to) pulled it out from under that async work.
      - name: Deploy new version to the environment (ephemeral key, kept alive until the update finishes)
        env:
          AWS_ACCESS_KEY_ID: ${{ env.UPDATE_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ env.UPDATE_KEY_SECRET }}
          AWS_SESSION_TOKEN: ""
        run: |
          for ATTEMPT in 1 2 3 4 5 6; do
            if aws elasticbeanstalk update-environment \
              --region "${{ vars.AWS_REGION }}" \
              --environment-name "${{ vars.EB_ENVIRONMENT_NAME }}" \
              --version-label "$VERSION"; then
              exit 0
            fi
            echo "update-environment failed (attempt $ATTEMPT/6) - the key may not have propagated yet, retrying in 5s"
            sleep 5
          done
          echo "::error::update-environment did not succeed after 6 attempts"
          exit 1

      # Deliberately no ephemeral-key override here - DescribeEnvironments (all this loop calls) is
      # already covered by the OIDC role from the "Configure AWS credentials" step.
      #
      # Not using `aws elasticbeanstalk wait environment-updated` here - that waiter only checks
      # Status/Health, and update-environment returns before EB's status has actually flipped away
      # from the previous "Ready". If the waiter's first poll lands on that stale pre-update state,
      # it reports success immediately, before anything has actually deployed (this is what was
      # letting the pipeline "succeed" while the live site kept serving the old version). Polling
      # until VersionLabel itself matches $VERSION closes that gap, and logs each poll so a stuck
      # or failed rollout is visible in the run output instead of a silent timeout.
      - name: Wait for the environment to finish updating
        run: |
          for i in $(seq 1 40); do
            read -r ENV_STATUS ENV_VERSION ENV_HEALTH <<< "$(aws elasticbeanstalk describe-environments \
              --environment-names "${{ vars.EB_ENVIRONMENT_NAME }}" \
              --query "Environments[0].[Status,VersionLabel,Health]" --output text)"
            echo "poll $i: Status=$ENV_STATUS Version=$ENV_VERSION Health=$ENV_HEALTH"
            if [ "$ENV_STATUS" = "Ready" ] && [ "$ENV_VERSION" = "$VERSION" ]; then
              if [ "$ENV_HEALTH" = "Red" ]; then
                echo "::error::Environment reached version $VERSION but Health is Red"
                exit 1
              fi
              echo "Environment is on version $VERSION and Ready."
              exit 0
            fi
            sleep 15
          done
          echo "::error::Timed out waiting for environment to reach Ready on version $VERSION"
          exit 1

      - name: Delete the ephemeral access key
        if: always()
        run: |
          if [ -n "$UPDATE_KEY_ID" ]; then
            aws iam delete-access-key --user-name "${{ vars.EB_UPDATE_ONLY_USER_NAME }}" --access-key-id "$UPDATE_KEY_ID"
          fi

      - name: Verify the deployed version responds
        run: |
          URL=$(aws elasticbeanstalk describe-environments \
            --environment-names "${{ vars.EB_ENVIRONMENT_NAME }}" \
            --query "Environments[0].CNAME" --output text)
          echo "Checking http://$URL/"
          RESPONSE=$(curl -sf "http://$URL/")
          echo "$RESPONSE"
          echo "$RESPONSE" | grep -q "$VERSION" || { echo "::error::Live version does not match $VERSION"; exit 1; }
